# Publishes the app to GitHub Pages on every push to main:
# https://fronk001.github.io/gym/
#
# tools/build.py turns src/ into dist/ (standard library only), which is what
# goes online. Same setup as the Mongolian app: configure-pages creates the
# Pages site itself, which the branch-based deploy never did there.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: python3 tools/build.py

      - name: Check nothing personal is published
        run: |
          if [ -e dist/data/seed.local.js ]; then
            echo "::error::dist/ contains seed.local.js, the Notes import"
            exit 1
          fi
          test -f dist/index.html
          test -f dist/sw.js
          if grep -q "__VERSION__\|__FILES__" dist/sw.js; then
            echo "::error::dist/sw.js was not stamped with a version and file list"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
